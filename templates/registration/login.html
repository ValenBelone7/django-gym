{% extends 'gimnasio/base.html' %}
{% block content %}
<div class="auth-card">
    <h2>Iniciar sesión</h2>
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}
                    <div class="field-error">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn">Ingresar</button>
    </form>
    <p class="auth-link">¿No tenés cuenta? <a href="{% url 'register' %}">Registrate</a></p>
</div>
{% endblock %}
